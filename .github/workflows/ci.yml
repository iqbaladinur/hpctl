name: ci

on:
  push:
    branches: [main]
    # Docs-only changes build nothing, so they do not start a run. Workflow and
    # source changes always do — a broken ci.yml has to fail loudly.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '**.gitignore'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '**.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: cli (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o /tmp/hpctl .

  companion:
    name: companion (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-ci
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
